spring.h2.console.enabled=true
spring.datasource.url=jdbc:h2:mem:onboardingexercise;DB_CLOSE_DELAY=-1
spring.datasource.sql-script-encoding=UTF-8
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.hibernate=OFF
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.session_factory.statement_inspector=vn.elca.training.util.SqlCaptureInspector
decorator.datasource.p6spy.custom-format=vn.elca.training.util.P6SpySqlFormatter

server.port=8080
server.servlet.context-path=/